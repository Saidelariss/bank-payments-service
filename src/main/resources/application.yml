spring.application.name: bank-payments-service
spring:
  datasource:
    url: jdbc:h2:./testdb/bank_payments
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  h2:
    console:
      enabled: true
server:
  port: 8083
management:
  endpoints:
    web:
      exposure:
        include: health,info